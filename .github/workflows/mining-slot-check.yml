name: Mining Slot SDK checks

on:
  push:
    branches: [mining-slot-integration]
    paths:
      - "games/mining_slot/**"
      - "src/**"
      - "optimization_program/**"
      - ".github/workflows/mining-slot-check.yml"
  workflow_dispatch:

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Mining Slot modules
        run: python -m compileall -q games/mining_slot
      - name: Run deterministic game-rule and HTTP tests
        working-directory: games/mining_slot
        run: python -m unittest discover -s tests -v

  sdk-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile SDK game modules
        run: python -m compileall -q games/mining_slot
      - name: Generate books, optimize, analyze, and verify RGS formats
        run: |
          cd games/mining_slot
          PYTHONPATH=../.. python run.py
